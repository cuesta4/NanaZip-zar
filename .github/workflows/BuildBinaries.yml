name: Build NanaZip ZArchive

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Documents/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'Documents/**'
      - '**/*.md'
  schedule:
    # Keep the fork rebased and publish a fresh package once per day.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: Fetch upstream/main and rebase the fork before building
        required: true
        default: true
        type: boolean

env:
  UPSTREAM_REPOSITORY: M2Team/NanaZip
  UPSTREAM_BRANCH: main
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  synchronize:
    name: Fetch and rebase upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.revision.outputs.source_commit }}
      upstream_commit: ${{ steps.revision.outputs.upstream_commit }}
      sync_performed: ${{ steps.sync.outputs.sync_performed || 'false' }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.repository.default_branch }}
        submodules: 'recursive'

    - name: Configure git identity
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

    - name: Fetch and rebase fork main onto upstream main
      id: sync
      if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.sync_upstream)
      shell: bash
      run: |
        set -Eeuo pipefail

        fork_branch='${{ github.event.repository.default_branch }}'
        if [[ "$fork_branch" != "$UPSTREAM_BRANCH" ]]; then
          echo "The fork default branch ($fork_branch) does not match the configured upstream branch ($UPSTREAM_BRANCH)." >&2
          exit 1
        fi

        git remote remove upstream 2>/dev/null || true
        git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
        git fetch --no-tags --prune upstream "$UPSTREAM_BRANCH"
        git switch "$fork_branch"

        echo 'Rebasing fork main onto upstream/main.'
        git rebase "upstream/$UPSTREAM_BRANCH"

        # GITHUB_TOKEN pushes do not recursively trigger workflows. The build
        # job below consumes this exact rebased commit in the same run.
        git push --force-with-lease origin "HEAD:$fork_branch"
        echo "sync_performed=true" >> "$GITHUB_OUTPUT"

    - name: Record source revisions
      id: revision
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        if git rev-parse --verify "refs/remotes/upstream/$UPSTREAM_BRANCH" >/dev/null 2>&1; then
          echo "upstream_commit=$(git rev-parse "refs/remotes/upstream/$UPSTREAM_BRANCH")" >> "$GITHUB_OUTPUT"
        else
          echo 'upstream_commit=not-synced' >> "$GITHUB_OUTPUT"
        fi

  build:
    name: Build and package MSIX
    needs: synchronize
    if: needs.synchronize.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ needs.synchronize.outputs.source_commit }}
      UPSTREAM_COMMIT: ${{ needs.synchronize.outputs.upstream_commit }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ needs.synchronize.outputs.source_commit }}
        submodules: 'recursive'
    - uses: microsoft/setup-msbuild@v3
    - name: Clear local NuGet cache (workaround for failed restores on windows-latest)
      run: dotnet nuget locals all --clear
    - name: Build
      run: MSBuild -binaryLogger:Output\BuildAllTargets.binlog -m BuildAllTargets.proj

    - name: Stage nanazip-zarchive artifact
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $staging = Join-Path $env:GITHUB_WORKSPACE 'Output\Artifacts\nanazip-zarchive'
        $appPackages = Join-Path $env:GITHUB_WORKSPACE 'Output\Binaries\AppPackages'
        $extensionInstallerDirectory = Join-Path $env:GITHUB_WORKSPACE 'Output'

        if (-not (Test-Path -LiteralPath $appPackages)) {
            throw "The MSIX output directory was not produced: $appPackages"
        }

        New-Item -ItemType Directory -Force -Path $staging | Out-Null
        $packageDestination = Join-Path $staging 'AppPackages'
        New-Item -ItemType Directory -Force -Path $packageDestination | Out-Null
        Copy-Item -Path (Join-Path $appPackages '*') -Destination $packageDestination -Recurse -Force

        $extensionInstallers = @(Get-ChildItem -LiteralPath $extensionInstallerDirectory -Filter 'NanaZip.ExtensionPackage_*.exe' -File -ErrorAction SilentlyContinue)
        if ($extensionInstallers.Count -gt 0) {
            $extensionDestination = Join-Path $staging 'ExtensionInstaller'
            New-Item -ItemType Directory -Force -Path $extensionDestination | Out-Null
            $extensionInstallers | Copy-Item -Destination $extensionDestination -Force
        }

        $manifest = [ordered]@{
            artifact = 'nanazip-zarchive'
            product = 'NanaZip'
            zarchive_module = 'not included yet'
            source_commit = $env:SOURCE_COMMIT
            upstream_repository = $env:UPSTREAM_REPOSITORY
            upstream_commit = $env:UPSTREAM_COMMIT
            generated_at_utc = (Get-Date).ToUniversalTime().ToString('o')
        }
        $manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $staging 'build-manifest.json') -Encoding utf8

    - name: Upload nanazip-zarchive package
      uses: actions/upload-artifact@v7
      with:
        name: nanazip-zarchive
        path: Output/Artifacts/nanazip-zarchive
        if-no-files-found: error
        retention-days: 30

    - name: Upload MSIX Bundle
      uses: actions/upload-artifact@v7
      with:
        name: NanaZip_Mainline_ApplicationPackages
        path: Output/Binaries/AppPackages
    - name: Upload Extension Package Installer
      uses: actions/upload-artifact@v7
      with:
        name: NanaZip_Mainline_ExtensionPackageInstaller
        path: Output/NanaZip.ExtensionPackage_*.exe
    - name: Upload MSBuild Build Process Binary Log
      uses: actions/upload-artifact@v7
      if: '!cancelled()'
      with:
        name: NanaZip_Mainline_BuildBinaryLog
        path: Output/BuildAllTargets.binlog
    - name: Upload Portable Binaries
      uses: actions/upload-artifact@v7
      with:
        name: NanaZip_Mainline_PortableBinaries
        path: Output/Binaries/Root/Binaries
    - name: Upload Debug Symbols
      uses: actions/upload-artifact@v7
      with:
        name: NanaZip_Mainline_DebugSymbols
        path: Output/Binaries/Root/Symbols

# Workflow trigger verification
