name: Actions Probe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Verify GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner availability
        run: |
          echo "GitHub Actions runner is operational."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
